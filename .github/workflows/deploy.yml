name: Deploy to cPanel

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env
            .env.local
            .env*
            .restart

      - name: Trigger restart
        run: |
          python3 - <<'EOF'
          import ftplib, os, io
          from datetime import datetime, timezone

          server    = os.environ['FTP_SERVER'].replace('ftp://', '').replace('ftps://', '').strip().rstrip('/')
          username  = os.environ['FTP_USERNAME'].strip()
          password  = os.environ['FTP_PASSWORD'].strip()
          directory = os.environ['FTP_SERVER_DIR'].strip()

          content = datetime.now(timezone.utc).isoformat().encode()
          with ftplib.FTP(server) as ftp:
              ftp.login(username, password)
              ftp.cwd(directory)
              ftp.storbinary('STOR .restart', io.BytesIO(content))
          print("Restart trigger uploaded OK")
          EOF
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
